<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Activation — Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg"></div>
<main>
<section id="login" class="card login">
  <div class="brand"><span>DA</span><div><h1>Device Activation</h1><small>Private Admin Panel</small></div></div>
  <h2>Admin sign in</h2>
  <p class="muted">Manage activation records stored in your GitHub repository.</p>
  <form id="loginForm">
    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <div id="loginMsg" class="msg"></div>
</section>

<section id="app" hidden>
  <header class="top">
    <div class="brand"><span>DA</span><div><h1>Device Activation</h1><small>GitHub-backed control panel</small></div></div>
    <button id="logout" class="ghost">Logout</button>
  </header>

  <div class="stats">
    <div><b id="total">0</b><span>Total</span></div>
    <div><b id="active">0</b><span>Active</span></div>
    <div><b id="expired">0</b><span>Expired</span></div>
  </div>

  <section class="card">
    <div class="sectionHead">
      <div><h2>Activation records</h2><p class="muted">Changes are committed directly to <code>usrdata.json</code>.</p></div>
      <button id="add" class="primary">+ Add record</button>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="Search key or device ID…">
      <button id="reload" class="ghost">Refresh</button>
    </div>
    <div class="tableWrap">
      <table><thead><tr><th>Device ID</th><th>Key</th><th>Expiry</th><th>Offline</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
  </section>
  <div id="msg" class="msg"></div>
</section>
</main>
<script src="/app.js"></script>
</body>
                        </html>
